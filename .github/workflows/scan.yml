name: Swing scan

on:
  schedule:
    - cron: "30 21 * * 1-5"   # weekdays ~4:30pm ET (winter); 5:30pm ET in summer
  workflow_dispatch:          # lets you run it manually to test

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install yfinance pandas requests
      - run: python swing_scanner.py
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
